  <style>
    

    .contact-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    .contact-form {
      background: var(--bg-card-solid);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow-sm);
      margin: 2rem auto;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-primary);
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    button[type="submit"] {
      background: #3498db;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
      gap: 0.5rem;
    }

    button[type="submit"]:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    [data-theme="dark"] button[type="submit"] {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    [data-theme="dark"] button[type="submit"]:hover {
      background: var(--accent-soft-hover);
      transform: translateY(-2px);
    }

    .section-description {
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 2rem;
    }

    .contact-section h2 {
      text-align: center;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .social-links {
      margin-top: 3rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }
  </style>

        <form class="contact-form" action="https://formsubmit.co/karimabdelnour25@gmail.com" method="POST">
          <!-- FormSubmit configuration -->
          <input type="hidden" name="_subject" value="Portfolio Contact Form">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="true">
          <input type="hidden" name="_next" value="https://karimuq.github.io/website/thanks.html">

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <button type="submit">
            Send Message
          </button>
        </form>
