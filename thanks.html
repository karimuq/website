    .thank-you-section {

    .thank-you-message {

      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .back-button:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    [data-theme="dark"] .back-button {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    [data-theme="dark"] .back-button:hover {
      background: var(--accent-soft-hover);
